<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1214" />
    <meta name="robots" content="index,follow" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>Telão Dani &amp; Carine — Galeria ao vivo | CaseBem</title>
    <meta
      name="description"
      content="Telão ao vivo do casamento de Dani e Carine: fotos da festa em tela cheia para TV e projetor."
    />
    <link rel="canonical" href="https://casebem.com/telao/" />
    <meta property="og:title" content="Telão Dani &amp; Carine — Galeria ao vivo" />
    <meta
      property="og:description"
      content="Fotos da festa em tela cheia. Abra no TV ou projetor."
    />
    <meta property="og:url" content="https://casebem.com/telao/" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/telao/telao.css?v=20261120e" />
  </head>
  <body>
    <div id="app" class="telao">
      <div class="telao-shade" aria-hidden="true"></div>
      <div id="bars" class="telao-bars" aria-hidden="true"></div>
      <header class="telao-top">
        <p>Dani &amp; Carine</p>
        <div class="telao-top__actions">
          <button type="button" id="btn-cinema">Tela cheia</button>
        </div>
      </header>
      <div id="rank-break" class="telao-rank" role="status">
        <div class="telao-rank__inner">
          <p class="telao-rank__eyebrow">Placar ao vivo</p>
          <h2 class="telao-rank__title">Ranking</h2>
          <ol id="rank-list" class="telao-rank__list"></ol>
          <p id="rank-empty" class="telao-rank__empty is-hidden">Ainda sem pontuação — joguem nos desafios!</p>
        </div>
      </div>
      <div id="draw-soon" class="telao-draw telao-draw--soon" role="status">
        <div class="telao-draw__inner">
          <p class="telao-draw__eyebrow">Dani &amp; Carine</p>
          <p class="telao-draw__soon">Sorteio em breve</p>
        </div>
      </div>
      <div id="draw-reel" class="telao-draw telao-draw--reel" role="status">
        <div id="draw-confetti" class="telao-draw__confetti" aria-hidden="true"></div>
        <div class="telao-draw__inner">
          <p id="draw-label" class="telao-draw__label">Sorteando</p>
          <div class="telao-draw__reel-window">
            <p id="draw-number" class="telao-draw__number">—</p>
          </div>
          <p id="draw-hint" class="telao-draw__hint">A roleta está girando…</p>
          <p id="draw-name" class="telao-draw__name is-hidden">—</p>
          <p id="draw-sub" class="telao-draw__sub is-hidden">—</p>
        </div>
      </div>
      <div class="telao-stage" id="stage">
        <figure id="slide" class="telao-slide" style="display: none">
          <img id="slide-img" alt="" />
          <figcaption>
            <strong id="slide-title"></strong>
            <span id="slide-guest"></span>
          </figcaption>
        </figure>
        <p id="empty" class="telao-empty">Aguardando fotos da festa…</p>
        <button type="button" class="telao-hit telao-hit--left" id="btn-prev" aria-label="Anterior"></button>
        <button type="button" class="telao-hit telao-hit--right" id="btn-next" aria-label="Próxima"></button>
      </div>
    </div>
    <noscript>
      <p style="color: #fff; text-align: center; padding: 2rem">
        Ative JavaScript para ver o telão ao vivo de Dani e Carine.
      </p>
    </noscript>
    <script src="/telao/telao.js?v=20261120e"></script>
  </body>
</html>
